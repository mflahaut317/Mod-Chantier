name: Launcher

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        working-directory: launcher
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem launcher/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName PixelPotes-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: PixelPotes-Setup
          path: PixelPotes-Setup.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher
          name: Pixel Potes (launcher)
          body: "Installateur du launcher Pixel Potes pour Windows : télécharger PixelPotes-Setup.exe et double-cliquer."
          make_latest: false
          files: PixelPotes-Setup.exe
          overwrite_files: true
