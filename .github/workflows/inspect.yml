name: Inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava || true
      - name: Inspect
        run: |
          JAR=$(grep -l "net/minecraft/client/Minecraft.class" $(find build ~/.gradle -name '*.jar' 2>/dev/null) 2>/dev/null | head -1)
          echo "JAR=$JAR"
          CP="$JAR"
          javap -cp "$CP" net.minecraft.client.gui.GuiGraphicsExtractor | grep -E 'public .*(fill|text|String|item|Item)\(' | head -60
          javap -cp "$CP" net.minecraft.client.Options | grep -iE 'hide|gui' | head
          javap -cp "$CP" net.minecraft.client.Minecraft | grep -iE 'hide|gui|options' | head
          javap -cp "$CP" net.minecraft.client.gui.Gui | grep -iE 'hidden|hide|visible' | head
