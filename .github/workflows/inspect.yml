name: Inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava || true
      - name: Inspect
        run: |
          JAR=$(grep -l "net/minecraft/client/Minecraft.class" $(find build ~/.gradle -name '*.jar' 2>/dev/null) 2>/dev/null | head -1)
          echo "JAR=$JAR"
          CP="$JAR:$(find ~/.gradle build -name 'neoforge-*.jar' 2>/dev/null | tr '\n' ':')"
          echo "=== MC gizmo"; javap -p -cp "$CP" net.minecraft.client.Minecraft 2>&1 | grep -iE 'gizmo' | head
          echo "=== LevelRenderer gizmo"; javap -p -cp "$CP" net.minecraft.client.renderer.LevelRenderer 2>&1 | grep -iE 'gizmo' | head
          echo "=== Simple"; javap -cp "$CP" net.minecraft.gizmos.SimpleGizmoCollector 2>&1 | head -20
          echo "=== Temp"; javap -cp "$CP" 'net.minecraft.gizmos.Gizmos$TemporaryCollection' 2>&1 | head
          echo "=== Coll"; javap -cp "$CP" net.minecraft.gizmos.GizmoCollector 2>&1 | head
          echo "=== RLSE subs"; for J in $(echo "$CP" | tr ':' ' '); do [ -f "$J" ] && jar tf "$J" | grep -E 'RenderLevelStageEvent|client/event/ClientTickEvent|client/event/.*Gizmo' ; done | sort -u
          javap -cp "$CP" 'net.neoforged.neoforge.client.event.RenderLevelStageEvent$AfterTranslucentBlocks' 2>&1 | head -8
          echo "=== Debug"; javap -p -cp "$CP" net.minecraft.client.renderer.debug.DebugRenderer 2>&1 | grep -iE 'emit|gizmo|public' | head -20
