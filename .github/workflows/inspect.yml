name: Inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava || true
      - name: Inspect
        run: |
          JAR=$(grep -l "net/minecraft/client/Minecraft.class" $(find build ~/.gradle -name '*.jar' 2>/dev/null) 2>/dev/null | head -1)
          echo "JAR=$JAR"
          CP="$JAR:$(find ~/.gradle build -name 'neoforge-*.jar' 2>/dev/null | tr '\n' ':')"
          for c in net.minecraft.world.item.crafting.RecipeManager net.minecraft.world.item.crafting.RecipeHolder net.minecraft.world.item.crafting.Recipe net.minecraft.world.item.crafting.ShapedRecipe net.minecraft.world.item.crafting.ShapelessRecipe net.minecraft.world.item.crafting.SingleItemRecipe net.minecraft.world.item.crafting.AbstractCookingRecipe net.minecraft.world.item.crafting.Ingredient net.minecraft.world.item.crafting.PlacementInfo net.minecraft.world.item.crafting.RecipeMap; do echo "=== $c"; javap -cp "$CP" "$c" 2>&1 | grep -E 'public|protected|Error' | grep -vE 'equals|hashCode|toString' | head -45; done
          javap -cp "$CP" net.minecraft.server.MinecraftServer | grep -i recipe
