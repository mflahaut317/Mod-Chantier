name: Inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava || true
      - name: Inspect
        run: |
          JAR=$(grep -l "net/minecraft/client/Minecraft.class" $(find build ~/.gradle -name '*.jar' 2>/dev/null) 2>/dev/null | head -1)
          echo "JAR=$JAR"
          CP="$JAR:$(find ~/.gradle build -name 'neoforge-*.jar' 2>/dev/null | tr '\n' ':')"
          echo "=== NativeImage"; javap -cp "$CP" com.mojang.blaze3d.platform.NativeImage > /tmp/ni.txt 2>&1; grep -E 'public com.mojang.blaze3d.platform.NativeImage\(|setPixel|getPixel|static .*read|close' /tmp/ni.txt | head
          echo "=== DynamicTexture"; javap -cp "$CP" net.minecraft.client.renderer.texture.DynamicTexture 2>&1 | head -15
          echo "=== TextureManager"; javap -cp "$CP" net.minecraft.client.renderer.texture.TextureManager 2>&1 | grep -E 'register|release' | head
          echo "=== Resource"; javap -cp "$CP" net.minecraft.server.packs.resources.Resource 2>&1 | grep -E 'open' | head -3
          OP=$(find ~/.gradle -name 'open-parties-and-claims*.jar' | grep -v sources | head -1); echo "OP=$OP"
          jar tf "$OP" | grep -E 'api/.*(OpenPACServerAPI|IServerPartyAPI|IPartyMemberAPI|IPartyManagerAPI|PartyManager).*class' | head -20
          for C in xaero.pac.common.server.api.OpenPACServerAPI xaero.pac.common.server.parties.party.api.IServerPartyAPI xaero.pac.common.parties.party.member.api.IPartyMemberAPI xaero.pac.common.server.parties.party.api.IPartyManagerAPI; do echo "== $C"; javap -cp "$OP:$CP" $C 2>&1 | head -40; done
