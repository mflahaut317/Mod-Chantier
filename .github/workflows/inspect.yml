name: Inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava || true
      - name: Inspect
        run: |
          set +e
          JAR=$(grep -l "net/minecraft/client/Minecraft.class" $(find build ~/.gradle -name '*.jar' 2>/dev/null) 2>/dev/null | head -1)
          echo "JAR=$JAR"
          CP="$JAR:$(find ~/.gradle build -name 'neoforge-*.jar' 2>/dev/null | tr '\n' ':')"
          javap -cp "$CP" net.minecraft.client.renderer.GameRenderer | grep -iE 'camera'
          javap -cp "$CP" net.minecraft.client.Minecraft | grep -iE 'camera'
          javap -cp "$CP" net.minecraft.client.Camera | grep -iE 'rotation|orientation|public'
          javap -cp "$CP" net.minecraft.client.renderer.state.level.CameraRenderState
          javap -cp "$CP" net.minecraft.client.renderer.entity.EntityRenderDispatcher | grep -iE 'camera'
