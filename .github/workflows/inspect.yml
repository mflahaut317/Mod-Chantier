name: Inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava || true
      - name: Inspect
        run: |
          JAR=$(grep -l "net/minecraft/client/Minecraft.class" $(find build ~/.gradle -name '*.jar' 2>/dev/null) 2>/dev/null | head -1)
          echo "JAR=$JAR"
          CP="$JAR:$(find ~/.gradle build -name 'neoforge-*.jar' 2>/dev/null | tr '\n' ':')"
          jar tf "$JAR" | grep -E 'net/minecraft/util/Util\$OS|ConfirmLinkScreen' | head
          javap -cp "$CP" 'net.minecraft.util.Util$OS' | head -30
          javap -cp "$CP" net.minecraft.client.gui.screens.ConfirmLinkScreen | grep -E 'public static' | head
