name: Inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava || true
      - name: Inspect
        run: |
          JAR=$(grep -l "net/minecraft/client/Minecraft.class" $(find build ~/.gradle -name '*.jar' 2>/dev/null) 2>/dev/null | head -1)
          echo "JAR=$JAR"
          CP="$JAR:$(find ~/.gradle build -name 'neoforge-*.jar' 2>/dev/null | tr '\n' ':')"
          echo "=== Display"; javap -p -cp "$CP" net.minecraft.world.entity.Display 2>&1 | grep -E 'Display\(|set[A-Z]|DATA_|Transformation' | head -40
          echo "=== BlockDisplay"; javap -p -cp "$CP" 'net.minecraft.world.entity.Display$BlockDisplay' 2>&1 | head -30
          echo "=== ClientLevel"; javap -p -cp "$CP" net.minecraft.client.multiplayer.ClientLevel 2>&1 | grep -iE 'addEntity|removeEntity|getEntity\(' | head
          echo "=== Entity id"; javap -p -cp "$CP" net.minecraft.world.entity.Entity 2>&1 | grep -E ' setId|void discard|setRemoved|void setPos\(double|setGlowingTag|noPhysics|setInvisible' | head
          echo "=== Transformation"; javap -cp "$CP" com.mojang.math.Transformation 2>&1 | grep -E 'public com.mojang.math.Transformation\(|identity' | head
          echo "=== EntityType BD"; javap -cp "$CP" net.minecraft.world.entity.EntityType 2>&1 | grep -E 'BLOCK_DISPLAY' | head -3
          echo "=== Brightness"; javap -cp "$CP" 'net.minecraft.util.Brightness' 2>&1 | head -8
