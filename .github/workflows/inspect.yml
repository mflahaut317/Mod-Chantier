name: Inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava || true
      - name: Inspect
        run: |
          set +e
          JAR=$(grep -l "net/minecraft/client/Minecraft.class" $(find build ~/.gradle -name '*.jar' 2>/dev/null) 2>/dev/null | head -1)
          echo "JAR=$JAR"
          CP="$JAR:$(find ~/.gradle build -name 'neoforge-*.jar' 2>/dev/null | tr '\n' ':')"
          javap -cp "$CP" net.neoforged.neoforge.client.IItemDecorator
          javap -cp "$CP" net.neoforged.neoforge.client.event.RegisterItemDecorationsEvent
          javap -cp "$CP" net.minecraft.client.resources.sounds.SimpleSoundInstance | grep forUI
          javap -cp "$CP" net.minecraft.sounds.SoundEvents | grep -E ' ITEM_BREAK| NOTE_BLOCK_PLING'
          javap -cp "$CP" net.minecraft.client.gui.Gui | grep -iE 'overlay'
          javap -cp "$CP" net.minecraft.world.item.ItemStack | grep -iE 'damage'
          javap -cp "$CP" net.minecraft.client.gui.GuiGraphicsExtractor | grep -E ' text\(| item\('
          javap -cp "$CP" net.neoforged.neoforge.client.gui.VanillaGuiLayers | grep -iE 'HOTBAR|SELECTED'
          javap -cp "$CP" net.neoforged.neoforge.client.event.RegisterGuiLayersEvent | grep register
