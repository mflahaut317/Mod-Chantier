name: Inspect
on:
  push:
    branches: [inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava || true
      - name: Inspect
        run: |
          JAR=$(grep -l "net/minecraft/client/Minecraft.class" $(find build ~/.gradle -name '*.jar' 2>/dev/null) 2>/dev/null | head -1)
          echo "JAR=$JAR"
          CP="$JAR:$(find ~/.gradle build -name 'neoforge-*.jar' 2>/dev/null | tr '\n' ':')"
          for c in net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.components.EditBox net.minecraft.client.gui.components.Button net.minecraft.client.gui.components.Button\$Builder net.minecraft.client.KeyMapping net.minecraft.client.KeyMapping\$Category net.neoforged.neoforge.client.event.RegisterKeyMappingsEvent net.neoforged.neoforge.client.event.ClientTickEvent\$Post net.neoforged.neoforge.network.registration.PayloadRegistrar com.mojang.blaze3d.platform.InputConstants net.minecraft.client.input.KeyEvent; do echo "=== $c"; javap -cp "$CP" "$c" 2>&1 | grep -E 'public|Error' | grep -vE 'equals|hashCode|toString' | head -45; done
          jar tf build/moddev/artifacts/minecraft-patched-*.jar | grep -iE 'blaze3d/platform/InputConstants|client/input/' | head -20
