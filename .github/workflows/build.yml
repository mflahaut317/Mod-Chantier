name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build Souvenirs
        run: ./gradlew -p souvenirs build

      - name: Build Tableau
        run: ./gradlew -p tableau build

      - name: Build Durabilite
        run: ./gradlew -p durabilite build

      - name: Build Visage
        run: ./gradlew -p visage build

      - name: Build Pixel Potes
        run: ./gradlew -p pixelpotes build

      - name: Build Evenements
        run: ./gradlew -p evenements build
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            build/libs/*.jar
            souvenirs/build/libs/*.jar
            tableau/build/libs/*.jar
            durabilite/build/libs/*.jar
            visage/build/libs/*.jar
            pixelpotes/build/libs/*.jar
            evenements/build/libs/*.jar

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dernier
          name: Dernière version
          body: Mods Chantier, Souvenirs, Tableau et Durabilité compilés automatiquement depuis le dernier commit de main.
          make_latest: true
          overwrite_files: false
          files: |
            build/libs/*.jar
            souvenirs/build/libs/*.jar
            tableau/build/libs/*.jar
            durabilite/build/libs/*.jar
            visage/build/libs/*.jar
            pixelpotes/build/libs/*.jar
            evenements/build/libs/*.jar
