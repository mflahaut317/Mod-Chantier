name: Sonde
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Sources Minecraft
        run: |
          ./gradlew -p pixelpotes compileJava -q || true
          J=pixelpotes/build/moddev/artifacts/minecraft-patched-26.3.0.115.jar
          unzip -l "$J" | grep -iE "LoadingOverlay|Logo" | head -20
          mkdir -p /tmp/x && cd /tmp/x && unzip -q -o "$GITHUB_WORKSPACE/$J" 'net/minecraft/client/gui/screens/LoadingOverlay*' 'com/mojang/blaze3d/platform/Window*' 'net/minecraft/client/renderer/texture/ReloadableTexture*' 'net/minecraft/client/renderer/texture/TextureContents*' || true
          for f in $(find /tmp/x -name "*.class" | grep -E "LoadingOverlay|Window.class|ReloadableTexture|TextureContents"); do echo "== $f"; javap -p -cp /tmp/x "$(echo ${f#/tmp/x/} | sed 's/\.class$//; s#/#.#g')"; done
          javap -p -c -cp /tmp/x 'net.minecraft.client.gui.screens.LoadingOverlay$LogoTexture' | head -80
