name: Sonde
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Sources Minecraft
        run: |
          ./gradlew -p pixelpotes compileJava -q || true
          J=$(find ~/.gradle pixelpotes/build . -name "*.jar" 2>/dev/null | grep -iE "minecraft.*(sources|merged|patched)|neoforge.*sources" | head -20)
          echo "$J"
          for j in $J; do
            unzip -l "$j" | grep -E "LoadingOverlay|LogoTexture" | head
            unzip -p "$j" net/minecraft/client/gui/screens/LoadingOverlay.java 2>/dev/null | head -150 && break
          done
