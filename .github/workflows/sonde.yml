name: Sonde
on: workflow_dispatch
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - name: Ecran de chargement NeoForge
        run: |
          mkdir -p /tmp/e && cd /tmp/e
          curl -sL -o ed.jar https://maven.neoforged.net/releases/net/neoforged/fancymodloader/earlydisplay/12.0.16/earlydisplay-12.0.16.jar
          unzip -q ed.jar
          cat net/neoforged/fml/earlydisplay/theme/theme-default.json; echo; cat net/neoforged/fml/earlydisplay/theme/theme-darkmode.json; echo
          for c in net/neoforged/fml/earlydisplay/theme/ThemeLoader net/neoforged/fml/earlydisplay/theme/ThemeMojangLogoElement; do javap -p -c -cp . ${c//\//.} | grep -E "ldc|invoke" | head -60; done
          grep -rl "ThemeLoader" --include=*.class . | head
          for c in $(grep -rl "ThemeLoader.load\|ThemeLoader" --include=*.class . | grep -v theme/ThemeLoader); do echo "== $c"; javap -p -c -cp . $(echo ${c#./} | sed 's/\.class$//; s#/#.#g') | grep -E "ldc|ThemeLoader|resolve|FMLPaths|getGameDir|config" | head -30; done
