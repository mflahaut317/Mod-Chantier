<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pixel Potes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="fond"></div>
<main>
  <header>
    <div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div>
      <h1>PIXEL POTES</h1>
      <p class="sous-titre">La survie entre potes</p>
    </div>
  </header>

  <section class="grille">
    <div class="carte" id="carte-serveur">
      <h2>Serveur</h2>
      <div class="etat"><span class="point" id="point"></span><span id="etat-texte">Connexion…</span></div>
      <div class="joueurs" id="joueurs"></div>
      <ul class="noms" id="noms"></ul>
      <div class="detail" id="detail"></div>
    </div>

    <div class="carte" id="carte-nouveautes">
      <h2>Nouveautés</h2>
      <ul class="nouveautes" id="nouveautes"><li class="vide">Chargement…</li></ul>
    </div>
  </section>

  <footer>
    <div class="ram">
      <label for="ram">Mémoire du jeu : <strong id="ram-valeur">4 Go</strong></label>
      <input type="range" id="ram" min="2048" max="8192" step="512" value="4096">
      <div class="conseil" id="conseil">4 à 6 Go conseillés avec les shaders</div>
    </div>
    <div class="action">
      <div class="progression" id="progression" hidden>
        <div class="barre"><div id="barre"></div></div>
        <div id="progression-texte"></div>
      </div>
      <button id="jouer">JOUER</button>
    </div>
  </footer>
  <div class="credit">Propulsé par Prism Launcher · Pas un produit officiel Minecraft. Non approuvé par Mojang ni Microsoft.</div>
</main>
<script src="app.js"></script>
</body>
</html>
