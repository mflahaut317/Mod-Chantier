<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>Serveur Minecraft</title>
<style>
  :root {
    --fond: #12161c; --carte: #1b2129; --carte2: #222a34; --bord: #2c3642;
    --texte: #e8edf2; --doux: #8e9bab; --vert: #5bd16a; --orange: #f0a83a; --rouge: #e5564b; --bleu: #5aa9f0; --or: #f2c94c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         padding: env(safe-area-inset-top) 0 24px; }
  header { padding: 18px 16px 8px; }
  h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .point { width: 10px; height: 10px; border-radius: 50%; background: var(--vert); box-shadow: 0 0 10px var(--vert); }
  .point.hors { background: var(--rouge); box-shadow: 0 0 10px var(--rouge); }
  .motd { color: var(--doux); margin-top: 2px; }
  .puces { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .puce { background: var(--carte); border: 1px solid var(--bord); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
  main { display: grid; gap: 12px; padding: 8px 12px; max-width: 1100px; margin: 0 auto; }
  @media (min-width: 820px) { main { grid-template-columns: 1fr 1fr; } .large { grid-column: 1 / -1; } }
  section { background: var(--carte); border: 1px solid var(--bord); border-radius: 16px; padding: 14px; }
  h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--doux); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--carte2); border-radius: 12px; padding: 10px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--doux); font-size: 12px; }
  .barre { height: 8px; background: var(--carte2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .barre i { display: block; height: 100%; border-radius: 99px; background: var(--bleu); transition: width .6s; }
  .ligne { display: flex; justify-content: space-between; color: var(--doux); font-size: 13px; margin-top: 10px; }
  .joueur { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--bord); }
  .joueur:first-of-type { border-top: 0; }
  .joueur img { width: 40px; height: 40px; border-radius: 8px; image-rendering: pixelated; background: var(--carte2); }
  .joueur .nom { font-weight: 600; }
  .joueur .infos { color: var(--doux); font-size: 13px; }
  .vide { color: var(--doux); font-style: italic; }
  .chantier { padding: 10px 0; border-top: 1px solid var(--bord); }
  .chantier:first-of-type { border-top: 0; padding-top: 0; }
  .chantier .tete { display: flex; justify-content: space-between; font-weight: 600; }
  .chantier .membres { color: var(--doux); font-size: 13px; }
  .fini { color: var(--vert); }
  .onglets { display: flex; gap: 6px; margin-bottom: 8px; }
  .onglets button { flex: 1; background: var(--carte2); color: var(--texte); border: 1px solid var(--bord); border-radius: 10px; padding: 7px; font: inherit; }
  .onglets button.actif { border-color: var(--bleu); color: var(--bleu); }
  .cadre-carte { position: relative; }
  canvas#carte { width: 100%; height: 380px; background: #0e1318; border-radius: 12px; display: block; touch-action: none; cursor: grab; image-rendering: pixelated; }
  .zoom-btn { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .zoom-btn button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--bord); background: rgba(27,33,41,.9); color: var(--texte); font-size: 18px; }
  .legende { display: flex; gap: 14px; color: var(--doux); font-size: 12px; margin-top: 8px; flex-wrap: wrap; }
  .souvenir { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--bord); }
  .souvenir:first-of-type { border-top: 0; padding-top: 0; }
  .icone { width: 34px; height: 34px; border-radius: 10px; background: var(--carte2); display: grid; place-items: center; font-size: 17px; }
  .souvenir .titre { font-weight: 600; }
  .souvenir .mort { color: var(--rouge); }
  .souvenir .meta { color: var(--doux); font-size: 12px; }
  .souvenir img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; margin-top: 8px; cursor: zoom-in; }
  footer { text-align: center; color: var(--doux); font-size: 12px; margin-top: 10px; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; place-items: center; z-index: 9; }
  #zoom img { max-width: 96vw; max-height: 92vh; border-radius: 10px; }
</style>
</head>
<body>
<header>
  <h1><span class="point" id="point"></span><span id="nom">Serveur Minecraft</span></h1>
  <div class="motd" id="motd">Connexion…</div>
  <div class="puces" id="puces"></div>
</header>
<main>
  <section><h2>Performances</h2><div id="perf"></div></section>
  <section><h2>Joueurs connectés</h2><div id="joueurs"></div></section>
  <section class="large"><h2>Carte</h2>
    <div class="onglets" id="dims"></div>
    <div class="cadre-carte">
      <canvas id="carte"></canvas>
      <div class="zoom-btn"><button onclick="zoomer(1.5)">+</button><button onclick="zoomer(1/1.5)">−</button><button onclick="centrer()">◎</button></div>
    </div>
    <div class="legende"><span>● joueur</span><span>■ chantier</span><span>◆ hologramme</span><span>glisse pour bouger · molette ou 2 doigts pour zoomer</span></div>
    <div class="legende" style="margin-top:2px">La carte se dessine toute seule autour des joueurs quand ils explorent.</div>
  </section>
  <section><h2>Chantiers</h2><div id="chantiers"></div></section>
  <section><h2>Journal du serveur</h2><div id="journal"></div></section>
</main>
<footer id="maj"></footer>
<div id="zoom" onclick="this.style.display='none'"><img id="zoomImg" alt=""></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONES = { exploit: '⭐', mort: '☠️', boss: '⚔️', succes: '🏆', chantier: '🏠', perso: '✎' };
const DIMS = { overworld: 'Monde', the_nether: 'Nether', the_end: 'End' };
let etat = null, dim = 'overworld', recu = 0;

function duree(ms) {
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), j = Math.floor(h / 24);
  return j ? `${j} j ${h % 24} h` : h ? `${h} h ${m % 60} min` : `${m} min`;
}
function ilya(t) {
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  return new Date(t).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
}
function couleurTps(t) { return t >= 19 ? 'var(--vert)' : t >= 15 ? 'var(--orange)' : 'var(--rouge)'; }

function dessiner() {
  const e = etat; if (!e || !e.perf) return;
  const p = e.perf, m = e.monde;
  $('point').className = 'point';
  $('motd').textContent = e.motd || '';
  $('puces').innerHTML = [
    `👥 ${e.joueurs.length} / ${m.joueursMax}`,
    `📅 Jour ${m.jour} · ${m.heure}`,
    m.orage ? '⛈ Orage' : m.pluie ? '🌧 Pluie' : '☀️ Beau temps',
    `⏱ En ligne depuis ${duree(p.enLigneDepuis)}`
  ].map(t => `<span class="puce">${t}</span>`).join('');

  const ram = Math.round(p.ramUtilisee / p.ramMax * 100);
  const disque = p.disqueTotal ? Math.round((1 - p.disqueLibre / p.disqueTotal) * 100) : 0;
  $('perf').innerHTML = `
    <div class="stats">
      <div class="stat"><b style="color:${couleurTps(p.tps)}">${p.tps}</b><span>TPS (20 = parfait)</span></div>
      <div class="stat"><b>${p.mspt}</b><span>ms par tick</span></div>
      <div class="stat"><b>${p.cpuServeur ?? '–'}%</b><span>processeur</span></div>
    </div>
    <div class="ligne"><span>Mémoire</span><span>${(p.ramUtilisee / 1024).toFixed(1)} / ${(p.ramMax / 1024).toFixed(1)} Go</span></div>
    <div class="barre"><i style="width:${ram}%;background:${ram > 85 ? 'var(--rouge)' : 'var(--bleu)'}"></i></div>
    <div class="ligne"><span>Disque</span><span>${p.disqueLibre.toFixed(0)} Go libres</span></div>
    <div class="barre"><i style="width:${disque}%"></i></div>`;

  $('joueurs').innerHTML = e.joueurs.length ? e.joueurs.map(j => `
    <div class="joueur">
      <img src="https://mc-heads.net/avatar/${esc(j.uuid)}/40" alt="" onerror="this.style.visibility='hidden'">
      <div><div class="nom">${esc(j.nom)}</div>
      <div class="infos">❤ ${j.vie} · 🍗 ${j.faim} · ✨ niv. ${j.niveau}<br>${DIMS[j.dimension] || esc(j.dimension)} · ${j.x} ${j.y} ${j.z}</div></div>
    </div>`).join('') : '<div class="vide">Personne pour l\'instant.</div>';

  $('chantiers').innerHTML = e.chantiers.length ? e.chantiers.map(c => `
    <div class="chantier">
      <div class="tete"><span>${esc(c.titre)}</span><span class="${c.termine ? 'fini' : ''}">${c.termine ? '✔ terminé' : c.pourcent + ' %'}</span></div>
      <div class="barre"><i style="width:${c.pourcent}%;background:${c.pourcent >= 100 ? 'var(--vert)' : 'var(--orange)'}"></i></div>
      <div class="membres">${esc(c.membres)} · ${c.materiaux} matériaux${c.holo ? ' · hologramme « ' + esc(c.holo) + ' »' : ''}</div>
    </div>`).join('') : '<div class="vide">Aucun chantier.</div>';

  $('journal').innerHTML = e.journal.length ? e.journal.map(s => `
    <div class="souvenir">
      <div class="icone">${ICONES[s.type] || '✎'}</div>
      <div>
        <div class="titre ${s.type === 'mort' ? 'mort' : ''}">${esc(s.titre)}</div>
        <div>${esc(s.texte)}</div>
        <div class="meta">${esc(s.joueur)} · ${ilya(s.date)}${s.lieu ? ' · ' + esc(s.lieu) : ''}</div>
        ${s.image ? `<img loading="lazy" src="/photo/${esc(s.id)}" alt="" onclick="zoom(this.src)">` : ''}
      </div>
    </div>`).join('') : '<div class="vide">Le journal est vide (mod Souvenirs).</div>';

  carte();
}

function zoom(src) { $('zoomImg').src = src; $('zoom').style.display = 'grid'; }

// ---------- Carte : tuiles de 512 x 512 blocs dessinées par le serveur ----------
const TUILE = 512;
const vue = { x: 0, z: 0, echelle: 1, centree: false };   // centre (blocs) et pixels par bloc
let tuiles = [], images = {}, dimTuiles = '', majTuiles = 0;

async function chargerTuiles() {
  try {
    tuiles = await (await fetch('/carte/' + dim, { cache: 'no-store' })).json();
    dimTuiles = dim; majTuiles = Date.now();
    for (const k in images) delete images[k]; // nouvelles versions des images
    dessinerCarte();
  } catch (e) {}
}

function pointsCarte() {
  const e = etat, pts = [];
  if (!e) return pts;
  e.joueurs.filter(j => j.dimension === dim).forEach(j => pts.push({ x: j.x, z: j.z, t: 'j', n: j.nom }));
  e.chantiers.forEach(c => {
    if (c.dimension && c.dimension.endsWith(dim)) pts.push({ x: c.x, z: c.z, t: 'c', n: c.titre });
    if (c.holo && c.holoDimension && c.holoDimension.endsWith(dim)) pts.push({ x: c.holoX, z: c.holoZ, t: 'h', n: c.holo });
  });
  return pts;
}

function centrer() {
  const pts = pointsCarte();
  if (pts.length) { vue.x = pts.reduce((a, p) => a + p.x, 0) / pts.length; vue.z = pts.reduce((a, p) => a + p.z, 0) / pts.length; }
  else if (tuiles.length) { vue.x = tuiles[0][0] * TUILE + TUILE / 2; vue.z = tuiles[0][1] * TUILE + TUILE / 2; }
  vue.echelle = 1;
  dessinerCarte();
}

function zoomer(f) { vue.echelle = Math.max(0.125, Math.min(8, vue.echelle * f)); dessinerCarte(); }

function carte() {
  $('dims').innerHTML = Object.entries(DIMS).map(([k, v]) =>
    `<button class="${k === dim ? 'actif' : ''}" onclick="changerDim('${k}')">${v}</button>`).join('');
  if (dimTuiles !== dim || Date.now() - majTuiles > 30000) chargerTuiles();
  if (!vue.centree && etat) { vue.centree = true; centrer(); }
  dessinerCarte();
}

function changerDim(k) { dim = k; vue.centree = false; dimTuiles = ''; carte(); }

function dessinerCarte() {
  const c = $('carte'), r = window.devicePixelRatio || 1;
  const L = c.clientWidth, H = c.clientHeight;
  if (c.width !== L * r) { c.width = L * r; c.height = H * r; }
  const g = c.getContext('2d');
  g.setTransform(r, 0, 0, r, 0, 0);
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#0e1318'; g.fillRect(0, 0, L, H);
  const X = x => L / 2 + (x - vue.x) * vue.echelle, Y = z => H / 2 + (z - vue.z) * vue.echelle;
  for (const [tx, tz] of tuiles) {
    const x = X(tx * TUILE), y = Y(tz * TUILE), t = TUILE * vue.echelle;
    if (x > L || y > H || x + t < 0 || y + t < 0) continue;
    const cle = dim + tx + '_' + tz;
    let img = images[cle];
    if (!img) {
      img = images[cle] = new Image();
      img.onload = dessinerCarte;
      img.src = `/carte/${dim}/${tx}/${tz}.png?t=${majTuiles}`;
    }
    if (img.complete && img.naturalWidth) g.drawImage(img, x, y, t, t);
  }
  if (!tuiles.length) {
    g.fillStyle = '#8e9bab'; g.font = '14px system-ui'; g.textAlign = 'center';
    g.fillText('Pas encore de carte : elle se dessine quand quelqu\'un explore.', L / 2, H / 2);
    g.textAlign = 'left';
  }
  for (const p of pointsCarte()) {
    const x = X(p.x), y = Y(p.z);
    g.lineWidth = 2; g.strokeStyle = '#fff';
    if (p.t === 'j') { g.fillStyle = '#5aa9f0'; g.beginPath(); g.arc(x, y, 6, 0, 7); g.fill(); g.stroke(); }
    if (p.t === 'c') { g.fillStyle = '#f0a83a'; g.fillRect(x - 6, y - 6, 12, 12); g.strokeRect(x - 6, y - 6, 12, 12); }
    if (p.t === 'h') { g.fillStyle = '#b98cf5'; g.beginPath(); g.moveTo(x, y - 8); g.lineTo(x + 8, y); g.lineTo(x, y + 8); g.lineTo(x - 8, y); g.closePath(); g.fill(); g.stroke(); }
    g.font = '600 13px system-ui';
    g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,.75)'; g.strokeText(p.n, x + 10, y + 4);
    g.fillStyle = '#fff'; g.fillText(p.n, x + 10, y + 4);
  }
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(8, H - 26, 150, 18);
  g.fillStyle = '#e8edf2'; g.font = '12px system-ui';
  g.fillText(`X ${Math.round(vue.x)}  Z ${Math.round(vue.z)}  ·  x${vue.echelle < 1 ? '1/' + Math.round(1 / vue.echelle) : vue.echelle}`, 14, H - 13);
}

// Glisser (souris ou doigt) et pincer pour zoomer
(() => {
  const c = $('carte'), doigts = new Map();
  let ecart = 0;
  c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); doigts.set(e.pointerId, { x: e.clientX, y: e.clientY }); });
  c.addEventListener('pointermove', e => {
    const avant = doigts.get(e.pointerId); if (!avant) return;
    if (doigts.size === 1) { vue.x -= (e.clientX - avant.x) / vue.echelle; vue.z -= (e.clientY - avant.y) / vue.echelle; }
    doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (doigts.size === 2) {
      const [a, b] = [...doigts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (ecart) zoomer(d / ecart);
      ecart = d;
    }
    dessinerCarte();
  });
  const fin = e => { doigts.delete(e.pointerId); ecart = 0; };
  c.addEventListener('pointerup', fin); c.addEventListener('pointercancel', fin);
  c.addEventListener('wheel', e => { e.preventDefault(); zoomer(e.deltaY < 0 ? 1.25 : 0.8); }, { passive: false });
  window.addEventListener('resize', dessinerCarte);
})();

async function charger() {
  try {
    const r = await fetch('/api/etat', { cache: 'no-store' });
    etat = await r.json(); recu = Date.now();
    dessiner();
  } catch (e) {
    $('point').className = 'point hors';
    $('motd').textContent = 'Serveur injoignable…';
  }
}
setInterval(() => { $('maj').textContent = recu ? 'Mis à jour ' + ilya(recu).replace("à l'instant", "à l'instant") : ''; }, 1000);
charger();
setInterval(charger, 5000);
</script>
</body>
</html>
